#cloud-config
# Provisions one Arc instance on a fresh VM. Injected as user-data at server
# creation (Hetzner, DigitalOcean, EC2 — any cloud-init distro).
#
# The provisioner substitutes the __PLACEHOLDER__ tokens before submitting this
# file. Secrets are written by cloud-init directly to a 0600 file and never
# appear in a shell command, so they stay out of the process table and out of
# any shell history on the box.
#
# Everything Arc-specific already lives in the image: this file installs Docker,
# writes config, and starts the stack. Provisioning time is dominated by the
# image pull, which is why the model weights are baked in rather than fetched
# on first boot.

package_update: true
packages:
  - ca-certificates
  - curl

write_files:
  - path: /opt/arc/.env
    permissions: "0600"
    owner: root:root
    content: |
      ANTHROPIC_API_KEY=__ANTHROPIC_API_KEY__
      ARC_IMAGE=__ARC_IMAGE__
      ARC_DOMAIN=__ARC_DOMAIN__
      ARC_ACME_EMAIL=__ARC_ACME_EMAIL__
      ARC_AGENTS=__ARC_AGENT_NAME__
      ARC_AGENT_MODEL=__ARC_AGENT_MODEL__
      ARC_TIER=personal
      ARC_ENABLE_TELEGRAM=0

  - path: /opt/arc/Caddyfile
    permissions: "0644"
    content: |
      {
      	email {$ARC_ACME_EMAIL}
      }

      {$ARC_DOMAIN} {
      	reverse_proxy arc:8420
      	header {
      		Strict-Transport-Security "max-age=31536000; includeSubDomains"
      		X-Content-Type-Options "nosniff"
      		X-Frame-Options "DENY"
      		Referrer-Policy "no-referrer"
      	}
      }

  - path: /opt/arc/docker-compose.yml
    permissions: "0644"
    content: |
      services:
        arc:
          image: ${ARC_IMAGE}
          restart: unless-stopped
          env_file: .env
          volumes:
            - arc-data:/data
          expose:
            - "8420"
        caddy:
          image: caddy:2-alpine
          restart: unless-stopped
          depends_on:
            - arc
          environment:
            ARC_DOMAIN: ${ARC_DOMAIN}
            ARC_ACME_EMAIL: ${ARC_ACME_EMAIL}
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
      volumes:
        arc-data:
        caddy-data:
        caddy-config:

runcmd:
  # Docker's own convenience installer — the distro packages lag too far behind
  # to have `docker compose` as a plugin.
  - [sh, -c, "curl -fsSL https://get.docker.com | sh"]
  - [systemctl, enable, --now, docker]
  - [sh, -c, "cd /opt/arc && docker compose up -d"]
  # Report readiness in the console log so a failed boot is visible rather than
  # silent. This runs INSIDE the container: Arc publishes no host port (Caddy is
  # the only ingress), so there is nothing to curl on the host's :8420.
  # The provisioner's own check is the public https://$ARC_DOMAIN/api/health.
  - [sh, -c, "cd /opt/arc && for i in $(seq 1 60); do docker compose exec -T arc curl -fsS http://127.0.0.1:8420/api/health && break || sleep 5; done"]

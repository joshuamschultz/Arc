# Arc online — one VM, one agent, TLS on a real hostname.
#
#   docker compose -f deploy/cloud/docker-compose.yml up -d
#
# Differs from the repo-root compose in exactly two ways: Arc publishes no host
# port (Caddy is the only ingress, so the dashboard cannot be reached over
# plaintext), and Caddy owns :80/:443 for automatic certificates.

services:
  arc:
    image: ${ARC_IMAGE:-arc:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_BOT_TOKEN: ${ARCAGENT_TELEGRAM_BOT_TOKEN:-}
      ARC_AGENTS: ${ARC_AGENTS:-arc_agent}
      ARC_AGENT_MODEL: ${ARC_AGENT_MODEL:-anthropic/claude-sonnet-5}
      ARC_TIER: ${ARC_TIER:-personal}
      ARC_ENABLE_TELEGRAM: ${ARC_ENABLE_TELEGRAM:-0}
      ARC_TELEGRAM_ALLOWED_USER_IDS: ${ARC_TELEGRAM_ALLOWED_USER_IDS:-}
      # arcmemory document/chunk index backend (SPEC-073 COMP-007). Empty DSN =>
      # the default sqlite+sqlite-vec index (no postgres). Set ARC_MEMORY_PG_DSN in
      # .env AND start the postgres service (`--profile postgres`) to use pgvector.
      ARC_MEMORY_PG_DSN: ${ARC_MEMORY_PG_DSN:-}
    volumes:
      - arc-data:/data
    expose:
      - "8420"

  # Optional pgvector index backend for arcmemory (SPEC-073). Off by default — it
  # only starts under `docker compose --profile postgres up` (or COMPOSE_PROFILES=
  # postgres). When enabled, point ARC_MEMORY_PG_DSN at it, e.g.
  #   ARC_MEMORY_PG_DSN=postgresql://arc:${POSTGRES_PASSWORD}@postgres:5432/arcmemory
  # and set index_backend=postgres in the agent config (deploy_node_overlays memory-config).
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env to enable the postgres profile}
      POSTGRES_DB: ${POSTGRES_DB:-arcmemory}
    volumes:
      - pg-data:/var/lib/postgresql/data
    expose:
      - "5432"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - arc
    environment:
      ARC_DOMAIN: ${ARC_DOMAIN}
      ARC_ACME_EMAIL: ${ARC_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates must survive recreation, or a redeploy re-requests them
      # and burns Let's Encrypt rate limit.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  arc-data:
  caddy-data:
  caddy-config:
  pg-data:

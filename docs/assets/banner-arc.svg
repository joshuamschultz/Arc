<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Arc — the self-tuning agent runtime. A performance curve climbs and brightens with each pass over a bank of tuning dials; every action stays signed and secure.">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001227"/>
      <stop offset="0.55" stop-color="#002550"/>
      <stop offset="1" stop-color="#00305F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#0073FE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0073FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="climb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0055BC"/>
      <stop offset="0.55" stop-color="#0073FE"/>
      <stop offset="0.8" stop-color="#5A9CFF"/>
      <stop offset="1" stop-color="#F68D2E"/>
    </linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FBEFF"/>
      <stop offset="1" stop-color="#0073FE"/>
    </linearGradient>
    <linearGradient id="knobHot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD9AE"/>
      <stop offset="1" stop-color="#F68D2E"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#5A9CFF" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- plate -->
  <rect width="1280" height="360" rx="18" fill="url(#plate)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)"/>
  <rect x="540" y="0" width="740" height="360" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="358.5" rx="17.25" fill="none" stroke="#5A9CFF" stroke-opacity="0.18"/>

  <!-- ================= LEFT: wordmark + line ================= -->
  <text x="80" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#FFFFFF">arc<tspan fill="#F68D2E">.</tspan></text>
  <text x="86" y="222" font-family="Verdana, Geneva, sans-serif" font-size="21" letter-spacing="0.5" fill="#DCEBFF">The self-tuning agent runtime</text>
  <text x="86" y="256" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15.5" letter-spacing="0.5" fill="#7FB2FF">tuned to any business &#183; sharper every turn</text>

  <!-- domain chips -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#C7DFFF">
    <g>
      <rect x="86"  y="286" width="66" height="26" rx="13" fill="#0073FE" fill-opacity="0.14" stroke="#5A9CFF" stroke-opacity="0.35"/>
      <text x="119" y="303" text-anchor="middle">sales</text>
    </g>
    <g>
      <rect x="160" y="286" width="80" height="26" rx="13" fill="#0073FE" fill-opacity="0.14" stroke="#5A9CFF" stroke-opacity="0.35"/>
      <text x="200" y="303" text-anchor="middle">finance</text>
    </g>
    <g>
      <rect x="248" y="286" width="82" height="26" rx="13" fill="#0073FE" fill-opacity="0.14" stroke="#5A9CFF" stroke-opacity="0.35"/>
      <text x="289" y="303" text-anchor="middle">support</text>
    </g>
    <g>
      <rect x="338" y="286" width="120" height="26" rx="13" fill="#F68D2E" fill-opacity="0.16" stroke="#F68D2E" stroke-opacity="0.45"/>
      <text x="398" y="303" text-anchor="middle" fill="#FFD9AE">your case</text>
    </g>
  </g>

  <!-- ================= RIGHT: tuning bank + climbing curve ================= -->
  <!-- baseline -->
  <line x1="590" y1="300" x2="1180" y2="300" stroke="#5A9CFF" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- tuning dials (equalizer): knobs rise left-to-right = tuned toward its best -->
  <g stroke="#5A9CFF" stroke-opacity="0.30" stroke-width="2">
    <line x1="612"  y1="300" x2="612"  y2="96"/>
    <line x1="684"  y1="300" x2="684"  y2="96"/>
    <line x1="756"  y1="300" x2="756"  y2="96"/>
    <line x1="828"  y1="300" x2="828"  y2="96"/>
    <line x1="900"  y1="300" x2="900"  y2="96"/>
    <line x1="972"  y1="300" x2="972"  y2="96"/>
    <line x1="1044" y1="300" x2="1044" y2="96"/>
    <line x1="1116" y1="300" x2="1116" y2="96"/>
  </g>
  <g>
    <rect x="600"  y="248" width="24" height="14" rx="7" fill="url(#knob)"/>
    <rect x="672"  y="212" width="24" height="14" rx="7" fill="url(#knob)"/>
    <rect x="744"  y="228" width="24" height="14" rx="7" fill="url(#knob)"/>
    <rect x="816"  y="182" width="24" height="14" rx="7" fill="url(#knob)"/>
    <rect x="888"  y="196" width="24" height="14" rx="7" fill="url(#knob)"/>
    <rect x="960"  y="150" width="24" height="14" rx="7" fill="url(#knob)"/>
    <rect x="1032" y="162" width="24" height="14" rx="7" fill="url(#knobHot)"/>
    <rect x="1104" y="118" width="24" height="14" rx="7" fill="url(#knobHot)"/>
  </g>

  <!-- climbing self-improvement curve, brightening as it rises -->
  <path d="M 596 286 C 720 284, 772 214, 900 200 S 1064 130, 1150 92" fill="none" stroke="url(#climb)" stroke-width="5.5" stroke-linecap="round" filter="url(#soft)" opacity="0.5"/>
  <path d="M 596 286 C 720 284, 772 214, 900 200 S 1064 130, 1150 92" fill="none" stroke="url(#climb)" stroke-width="4" stroke-linecap="round"/>

  <!-- iteration dots: each pass brighter than the last -->
  <circle cx="700" cy="252" r="6" fill="#5A9CFF" fill-opacity="0.7"/>
  <circle cx="900" cy="200" r="7" fill="#8FBEFF"/>
  <circle cx="1150" cy="92" r="12" fill="#F68D2E" filter="url(#soft)" opacity="0.7"/>
  <circle cx="1150" cy="92" r="7.5" fill="#FFD9AE"/>
  <circle cx="1150" cy="92" r="7.5" fill="none" stroke="#F68D2E" stroke-width="2"/>

  <!-- self-improving loop marker: it feeds itself -->
  <path d="M 1176 78 a 20 20 0 1 1 -14 -6" fill="none" stroke="#F68D2E" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 1162 72 l 0 12 l 12 -2 z" fill="#F68D2E" fill-opacity="0.8"/>

  <!-- secure, present but quiet: a small signed check -->
  <g transform="translate(1140,300)" opacity="0.9">
    <path d="M 0 -13 L 12 -8 L 12 3 C 12 11, 6 15, 0 17 C -6 15, -12 11, -12 3 L -12 -8 Z" fill="#0073FE" fill-opacity="0.16" stroke="#5A9CFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M -5 1 L -1 6 L 6 -4" fill="none" stroke="#8FBEFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1122" y="305" text-anchor="end" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#7FB2FF">signed &#183; audited</text>
</svg>

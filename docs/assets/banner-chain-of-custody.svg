<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Arc — a tamper-evident chain of signed audit records arcing across the banner.">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#001A38"/>
      <stop offset="1" stop-color="#002550"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#9CC2FF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="0.64" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#0073FE" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0073FE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#field)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#wash)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#F68D2E"/>

  <!-- wordmark -->
  <text x="72" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700" fill="#FFFFFF" letter-spacing="-2">arc</text>
  <rect x="76" y="215" width="238" height="3" fill="#F68D2E"/>
  <text x="74" y="254" font-family="Verdana, Geneva, sans-serif" font-size="23" font-weight="700" fill="#DCEBFF">Prove what your agents did</text>
  <text x="74" y="286" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" fill="#7FB2FF" letter-spacing="1.5">signed · chained · replayable</text>

  <!-- links -->
  <g stroke="#3D93FF" stroke-width="2" stroke-opacity="0.75">
    <line x1="556" y1="202" x2="586" y2="180"/>
    <line x1="722" y1="180" x2="752" y2="172"/>
    <line x1="888" y1="172" x2="918" y2="180"/>
    <line x1="1054" y1="180" x2="1084" y2="202"/>
  </g>
  <g fill="#0073FE">
    <circle cx="571" cy="191" r="4"/>
    <circle cx="737" cy="176" r="4"/>
    <circle cx="903" cy="176" r="4"/>
    <circle cx="1069" cy="191" r="4"/>
  </g>

  <!-- chained, signed records -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" text-anchor="middle">
    <g>
      <rect x="420" y="164" width="136" height="76" rx="10" fill="#062F63" stroke="#0055BC" stroke-width="1.5"/>
      <rect x="432" y="176" width="112" height="3" fill="#0073FE" fill-opacity="0.7"/>
      <text x="488" y="212" fill="#BFDBFF">3f7a…9c2e</text>
    </g>
    <g>
      <rect x="586" y="142" width="136" height="76" rx="10" fill="#073A79" stroke="#0073FE" stroke-width="1.5"/>
      <rect x="598" y="154" width="112" height="3" fill="#3D93FF" fill-opacity="0.8"/>
      <text x="654" y="190" fill="#D6E6FF">c18d…04b7</text>
    </g>
    <g>
      <rect x="752" y="134" width="136" height="76" rx="10" fill="#08458F" stroke="#3D93FF" stroke-width="1.5"/>
      <rect x="764" y="146" width="112" height="3" fill="#6FADFF" fill-opacity="0.85"/>
      <text x="820" y="182" fill="#EAF3FF">a950…7e13</text>
    </g>
    <g>
      <rect x="918" y="142" width="136" height="76" rx="10" fill="#073A79" stroke="#0073FE" stroke-width="1.5"/>
      <rect x="930" y="154" width="112" height="3" fill="#3D93FF" fill-opacity="0.8"/>
      <text x="986" y="190" fill="#D6E6FF">6b2f…d8a0</text>
    </g>
    <g>
      <rect x="1084" y="164" width="136" height="76" rx="10" fill="#3A2410" stroke="#F68D2E" stroke-width="2"/>
      <rect x="1096" y="176" width="112" height="3" fill="#F68D2E"/>
      <text x="1152" y="212" fill="#FFC98A">e42c…1f95</text>
    </g>
  </g>

  <text x="820" y="102" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" fill="#4da3ff" letter-spacing="5" text-anchor="middle">SIGNED CHAIN · TAMPER-EVIDENT</text>
  <text x="820" y="298" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" fill="#7FA8DC" letter-spacing="0.5" text-anchor="middle">every call attributable · every tool authorized · every action audited</text>
</svg>

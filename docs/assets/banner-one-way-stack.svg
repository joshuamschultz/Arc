<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Arc — a layered agent stack. arcllm, arcrun, arcagent, arcgateway and arcui, with arctrust as the cryptographic leaf. Dependencies point one way.">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001A38"/>
      <stop offset="0.6" stop-color="#002550"/>
      <stop offset="1" stop-color="#002E5E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#9CC2FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="0.68" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#0073FE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0073FE" stop-opacity="0"/>
    </radialGradient>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CC2FF"/>
    </marker>
  </defs>

  <rect width="1280" height="360" fill="url(#field)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#wash)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#F68D2E"/>

  <!-- wordmark -->
  <text x="72" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700" fill="#FFFFFF" letter-spacing="-2">arc</text>
  <rect x="76" y="217" width="238" height="3" fill="#F68D2E"/>
  <text x="74" y="256" font-family="Verdana, Geneva, sans-serif" font-size="23" font-weight="700" fill="#DCEBFF">Composable by construction</text>
  <text x="74" y="288" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" fill="#7FB2FF" letter-spacing="1.5">one layer, or the whole stack</text>

  <!-- arctrust: the leaf every layer stands on -->
  <rect x="470" y="52" width="38" height="264" rx="8" fill="#3A2410" stroke="#F68D2E" stroke-width="2"/>
  <text x="489" y="184" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#FFC98A" letter-spacing="3" text-anchor="middle" transform="rotate(-90 489 184)">arctrust</text>

  <!-- layers, lowest at the bottom -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace">
    <rect x="530" y="256" width="620" height="60" rx="9" fill="#00306B" stroke="#0055BC" stroke-width="1.5"/>
    <text x="556" y="294" font-size="26" font-weight="700" fill="#BFDBFF">arcllm</text>
    <text x="1124" y="292" font-size="14" fill="#6FA6EE" text-anchor="end" letter-spacing="1.5">16 providers, zero SDKs</text>

    <rect x="530" y="188" width="620" height="60" rx="9" fill="#00408E" stroke="#0073FE" stroke-width="1.5"/>
    <text x="556" y="226" font-size="26" font-weight="700" fill="#D6E6FF">arcrun</text>
    <text x="1124" y="224" font-size="14" fill="#8FBEFF" text-anchor="end" letter-spacing="1.5">the agentic loop</text>

    <rect x="530" y="120" width="620" height="60" rx="9" fill="#00529E" stroke="#3D93FF" stroke-width="1.5"/>
    <text x="556" y="158" font-size="26" font-weight="700" fill="#EAF3FF">arcagent</text>
    <text x="1124" y="156" font-size="14" fill="#B4D3FF" text-anchor="end" letter-spacing="1.5">tools, memory, modules</text>

    <rect x="530" y="52" width="300" height="60" rx="9" fill="#0A66C2" stroke="#6FADFF" stroke-width="1.5"/>
    <text x="556" y="90" font-size="26" font-weight="700" fill="#FFFFFF">arcgateway</text>
    <rect x="850" y="52" width="300" height="60" rx="9" fill="#0A66C2" stroke="#6FADFF" stroke-width="1.5"/>
    <text x="876" y="90" font-size="26" font-weight="700" fill="#FFFFFF">arcui</text>
  </g>

  <!-- dependencies point one way, never up -->
  <line x1="1190" y1="308" x2="1190" y2="62" stroke="#9CC2FF" stroke-width="2" marker-end="url(#up)"/>
  <text x="1224" y="184" font-family="Verdana, Geneva, sans-serif" font-size="14" fill="#9CC2FF" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90 1224 184)">depends on</text>
</svg>

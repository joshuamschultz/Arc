<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Arc — the security-first agent stack. A rising trace passing through four gates: identity, sign, authorize, audit.">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001A38"/>
      <stop offset="0.55" stop-color="#002550"/>
      <stop offset="1" stop-color="#00305F"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0055BC" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#0073FE"/>
      <stop offset="1" stop-color="#DCEBFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#9CC2FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="wash" cx="0.80" cy="0.26" r="0.7">
      <stop offset="0" stop-color="#0073FE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0073FE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#field)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#wash)"/>
  <rect x="0" y="0" width="1280" height="4" fill="#F68D2E"/>

  <!-- one turn, rising through four gates -->
  <path d="M470 300 C760 300 940 128 1215 100" fill="none" stroke="url(#trace)" stroke-width="9" stroke-linecap="round" stroke-opacity="0.22"/>
  <path d="M470 300 C760 300 940 128 1215 100" fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round"/>

  <g font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5" text-anchor="middle">
    <g stroke="#5A9CFF" stroke-opacity="0.5" stroke-width="1">
      <line x1="554" y1="299" x2="554" y2="313"/>
      <line x1="764" y1="247" x2="764" y2="261"/>
      <line x1="959" y1="170" x2="959" y2="184"/>
      <line x1="1151" y1="113" x2="1151" y2="127"/>
    </g>
    <g fill="#002550" stroke="#8FBEFF" stroke-width="2">
      <circle cx="554" cy="295" r="7"/>
      <circle cx="764" cy="243" r="7"/>
      <circle cx="959" cy="166" r="7"/>
    </g>
    <circle cx="1151" cy="109" r="8" fill="#F68D2E" stroke="#FFD9AE" stroke-width="2"/>
    <g fill="#C7DFFF">
      <text x="554" y="331">IDENTITY</text>
      <text x="764" y="279">SIGN</text>
      <text x="959" y="202">AUTHORIZE</text>
    </g>
    <text x="1151" y="145" fill="#FFC98A">AUDIT</text>
  </g>

  <!-- wordmark -->
  <text x="72" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700" fill="#FFFFFF" letter-spacing="-2">arc</text>
  <rect x="76" y="226" width="252" height="3" fill="#F68D2E"/>
  <text x="74" y="266" font-family="Verdana, Geneva, sans-serif" font-size="24" font-weight="700" fill="#DCEBFF" letter-spacing="0.5">Security-first agent stack</text>
  <text x="74" y="300" font-family="'JetBrains Mono', Menlo, Consolas, monospace" font-size="15" fill="#7FB2FF" letter-spacing="2">personal · enterprise · federal</text>
</svg>

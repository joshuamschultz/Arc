# Composio's long-tail integrations over its HOSTED MCP surface.
#
# D-588 ranks a connector's options: the vendor's own CLI first, a maintained MCP
# server second, an adapter we write only as a last resort. Composio is the second
# option in its strongest form — a first-party, vendor-hosted MCP endpoint that
# fronts hundreds of SaaS integrations — so this bundle attaches over MCP and not
# through an adapter we would have to keep in step with every upstream.
#
# The transport is HTTP, not stdio: there is no binary to install and nothing to
# place on PATH. The endpoint is NOT a single pinned host: Composio mints a
# per-user MCP server and hands the operator a `backend.composio.dev/v3/mcp/
# {SERVER_ID}?user_id=...` URL, which the operator pastes at connect time (carried
# under `[config.mcp].url_secret_field`). It cannot float freely, though — the
# `[config.mcp].url_origin` guard rejects any pasted URL not on `backend.composio.dev`,
# so a typo or a stolen host can never be substituted for the vendor's. The API key
# travels to the broker as an `x-api-key` header (Composio's hosted MCP rejects
# `Authorization: Bearer`), never onto a child process's environment or argv.
#
# Composio's catalog is enormous, which is exactly why `[tools].allow` is short and
# explicit. An omitted allowlist is the same unbounded grant as "*" and is refused
# above personal tier. A verb the broker starts serving that is not on this list —
# an admin or delete action the catalog grows tomorrow — can never register.
#
# This bundle ships Composio's READ-ONLY discovery verbs only: search the catalog,
# list toolkits and triggers, describe one tool. Action (egress) verbs are not
# granted here; a deployment that wants them adds them to its own copy once its
# egress posture (D-580) is set, so the shipped bundle sends nothing by default.

[extension]
name = "composio"
display_name = "Composio"
version = "1.0.0"
description = "Search and browse Composio's catalog of integrations, toolkits, and triggers."
attachment = "mcp"
tier_floor = "personal"

# Composio brokers ACTIONS across other people's SaaS; it is not itself a document
# store Arc ingests into Knowledge. Declared non_indexable with the architectural
# reason, rather than silently dropping out of the Knowledge lifecycle.
[knowledge]
mode = "non_indexable"
reason = "Composio is an action broker over third-party APIs, not a data-bearing source Arc can enumerate, map, and incrementally index; its own catalog is discovery metadata, not operator content."

# One credential: a Composio API key. It reaches the hosted MCP endpoint as an
# `x-api-key` header (see [config.mcp].auth_header / auth_scheme), and the
# [secrets.placement] below records the destination every stored connector
# credential must declare — the environment name a locally spawned Composio helper
# would read it from — so a stored value never lacks a named home.
[[secrets]]
name = "api_key"
prompt = "Your Composio API key. In the Composio dashboard at app.composio.dev open Settings, then API Keys, click Generate (or copy an existing key), and paste it here. It looks like a long random string and grants access to the connected accounts on your Composio project."
format = "api_token"
sensitive = true

[secrets.placement]
variable = "COMPOSIO_API_KEY"

# The operator-minted MCP endpoint. Composio does not expose one shared host; each
# operator creates their own MCP server in Composio and is handed a per-user URL of
# the shape `https://backend.composio.dev/v3/mcp/{SERVER_ID}?user_id=...`, which they
# paste here. `https_url` normalises what they paste (a bare host is refused, a plain
# `http://` refused); `[config.mcp].url_origin` then refuses any host but Composio's.
# Not sensitive — the operator should be able to read it back to confirm it is right.
[[secrets]]
name = "mcp_url"
prompt = "Your Composio MCP server URL. In the Composio dashboard create an MCP server for the toolkit you want (choosing the tools it may expose), then copy the generated URL — it looks like https://backend.composio.dev/v3/mcp/<server-id>?user_id=<you> — and paste it here."
format = "https_url"
sensitive = false

[tools]
# Read-only discovery verbs. Equality with [[tools.declared]] is enforced by the
# bundle suite: a declared verb missing here can never register, and an allowed
# verb with no declaration would silently take the restrictive default.
allow = [
  "COMPOSIO_SEARCH_TOOLS",
  "COMPOSIO_LIST_TOOLKITS",
  "COMPOSIO_GET_TOOL",
  "COMPOSIO_LIST_TRIGGERS",
]

[[tools.declared]]
name = "COMPOSIO_SEARCH_TOOLS"
description = "Search the Composio catalog for tools matching a query."
classification = "read_only"

[[tools.declared]]
name = "COMPOSIO_LIST_TOOLKITS"
description = "List the integration toolkits Composio exposes."
classification = "read_only"

[[tools.declared]]
name = "COMPOSIO_GET_TOOL"
description = "Read one Composio tool's schema and metadata by slug."
classification = "read_only"

[[tools.declared]]
name = "COMPOSIO_LIST_TRIGGERS"
description = "List the triggers available for the connected toolkits."
classification = "read_only"

[approval]
default = "outbound"

# The hosted MCP endpoint. `transport = "http"` selects the no-binary branch of
# build_attachment. The endpoint is operator-minted, not one pinned host, so `url`
# here is only a placeholder shape: `url_secret_field` names the [[secrets]] the
# operator pastes their real per-user URL into, and it overrides this at connect
# time. `url_origin` is the trust-boundary guard — the effective URL, pinned or
# pasted, must start with it, so no attacker host can be substituted. `auth_header`
# / `auth_scheme` say the API key travels as a raw `x-api-key` header (empty scheme
# ⇒ bare token), not `Authorization: Bearer`, which Composio's hosted MCP rejects.
# `credential_field` names which [[secrets]] carries that key. The per-tool
# classifications are defence in depth behind the allowlist: they fix each verb's
# classification rather than letting a poisoned upstream describe itself.
[config.mcp]
transport = "http"
url = "https://backend.composio.dev/v3/mcp/YOUR_SERVER_ID?user_id=YOUR_USER_ID"
url_secret_field = "mcp_url"
url_origin = "https://backend.composio.dev/"
credential_field = "api_key"
auth_header = "x-api-key"
auth_scheme = ""
client_name = "arc"

[config.mcp.resilience]
timeout_seconds = 60.0
max_attempts = 3

[config.mcp.tools.COMPOSIO_SEARCH_TOOLS]
classification = "read_only"

[config.mcp.tools.COMPOSIO_LIST_TOOLKITS]
classification = "read_only"

[config.mcp.tools.COMPOSIO_GET_TOOL]
classification = "read_only"

[config.mcp.tools.COMPOSIO_LIST_TRIGGERS]
classification = "read_only"

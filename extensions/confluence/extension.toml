# Confluence Cloud through this bundle's own REST adapter (alpha-2 P18-3, 3.T).
#
# D-588 ranks a connector's options: the vendor's own CLI first, a maintained MCP
# server second, an adapter we write only as a last resort. `acli` 1.3.22 has no
# Confluence search, create or update verb, so the CLI cannot serve this connector;
# sooperset/mcp-atlassian carries critical advisories and Atlassian's hosted MCP
# endpoint states it does not meet FedRAMP. So the transport is a small httpx
# client living inside this folder.
#
# Auth is Atlassian 3LO OAuth, the same Atlassian app slot the `jira` bundle uses.
# Connect opens Atlassian's consent page and Arc resolves the site's cloud id from
# accessible-resources BEFORE storing anything. Atlassian rotates refresh tokens;
# Arc persists each new one before use (credentials.py). Requests go to
# api.atlassian.com/ex/confluence/{cloud_id}/wiki/rest/api with a bearer from the
# credential handle. The scopes are Atlassian's classic Confluence scopes, which
# its scope table lists for the v1 content, search and space endpoints used here.
#
# The implementation is in arc_ext_confluence/, a subdirectory, because bundle-root
# .py files are scanned as agent capabilities and are import-policy-gated by tier.

[extension]
name = "confluence"
display_name = "Confluence"
version = "2.0.0"
description = "Search, read, and write Confluence pages in your team's spaces."
attachment = "native"
tier_floor = "personal"

[knowledge]
mode = "source"

[config.native]
entrypoint = "arc_ext_confluence"

[oauth]
provider = "atlassian"
authorize_url = "https://auth.atlassian.com/authorize"
token_url = "https://auth.atlassian.com/oauth/token"
resources_url = "https://api.atlassian.com/oauth/token/accessible-resources"
console_url = "https://developer.atlassian.com/console/myapps/"
refresh_token_secret = "refresh_token"
client_auth = "post_json"
pkce = false
account = "atlassian_site"
scopes = [
  "read:confluence-content.all",
  "read:confluence-space.summary",
  "search:confluence",
  "write:confluence-content",
  "offline_access",
]
authorize_params = { audience = "api.atlassian.com", prompt = "consent" }

[[secrets]]
name = "site"
prompt = "Your Atlassian site, WITHOUT https://, for example yourcompany.atlassian.net. Leave blank and Arc fills it in when your account reaches only one site."
sensitive = false
required = false

[[secrets]]
name = "cloud_id"
prompt = "Set for you when you click Connect: your Atlassian site id, read from the account you sign in with. You never type this."
sensitive = false
required = false

[[secrets]]
name = "refresh_token"
prompt = "Set for you when you click Connect. You never paste this."
required = false

# The cheapest real authenticated call: what the health probe loop runs.
# Reads one space with the saved bearer token.
[health]
probe = "attachment"

[tools]
allow = [
  "confluence_search_pages",
  "confluence_get_page",
  "confluence_list_spaces",
  "confluence_create_page",
  "confluence_update_page",
]

[[tools.declared]]
name = "confluence_search_pages"
description = "Search pages with CQL."
classification = "read_only"

[[tools.declared]]
name = "confluence_get_page"
description = "Read one page's body by id."
classification = "read_only"

[[tools.declared]]
name = "confluence_list_spaces"
description = "List the spaces this account can see."
classification = "read_only"

# Publishing to a space is publishing to that space's audience — a destination
# the model names. Tagged so the egress gate sees it (D-580).
[[tools.declared]]
name = "confluence_create_page"
description = "Create a page in a space."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "confluence_update_page"
description = "Replace an existing page's title and body."
classification = "state_modifying"
capability_tags = ["network_egress"]

[approval]
default = "outbound"

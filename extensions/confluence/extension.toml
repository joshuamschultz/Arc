# Confluence Cloud through this bundle's own REST adapter.
#
# D-588 ranks a connector's options: the vendor's own CLI first, a maintained MCP
# server second, an adapter we write only as a last resort — and a bundle taking
# the last option has to say what it checked. This one did, and this is it.
#
# OPTION 1, the vendor's CLI: checked against `acli` 1.3.22, the same binary the
# sibling `jira` bundle now runs on, on the deployment. It does not cover this
# connector. Its entire Confluence surface is:
#
#     acli confluence page   -> view                                (only)
#     acli confluence space  -> archive, create, list, restore, update, view
#     acli confluence blog   -> create, list, view
#
# Of the five tools declared below, `confluence_get_page` maps to `page view --id`
# and `confluence_list_spaces` maps to `space list`. The other three —
# `confluence_search_pages` (CQL), `confluence_create_page` and
# `confluence_update_page` — have no acli verb at all, and that includes BOTH
# verbs tagged `network_egress`, which are the reason this bundle has an approval
# mode. Rebuilding on acli would delete three of five tools, so it was not done.
# Re-check when acli grows `confluence page search|create|update`; nothing else
# about this bundle needs to change first.
#
# OPTION 2, an MCP server: sooperset/mcp-atlassian carries 35 advisories including
# a critical arbitrary-file-write to RCE, and Atlassian's own hosted MCP endpoint
# states it does not meet FedRAMP. Neither is adoptable here.
#
# So option 3, and the transport is ~300 lines of httpx living inside this folder.
#
# KNOWN LIMIT, recorded rather than discovered later: this adapter speaks basic
# auth with an UNSCOPED API token against `{site}.atlassian.net`. Atlassian is
# moving to SCOPED tokens, which are accepted only at
# `api.atlassian.com/ex/confluence/{cloudId}`. That is the deprecation that cost an
# afternoon on `jira`, and acli absorbed it there. Here it has not been built: the
# site's cloud id is fetchable unauthenticated (verified —
# `https://<site>/_edge/tenant_info` answers `{"cloudId":"…"}`), and Atlassian's
# own KB confirms basic auth still applies at the gateway, but nothing on this
# deployment holds a scoped token to test the path against, and shipping an
# unverified auth path is exactly the mistake being corrected. Until it is built,
# the 401 an operator sees names the scoped-token case explicitly instead of
# sending them to reissue a token that would fail the same way.
#
# The implementation is in arc_ext_confluence/, a subdirectory, because bundle-root
# .py files are scanned as agent capabilities and are import-policy-gated by tier.

[extension]
name = "confluence"
display_name = "Confluence"
version = "1.0.0"
description = "Search, read, and write Confluence pages in your team's spaces."
attachment = "native"
tier_floor = "personal"

[config.native]
entrypoint = "arc_ext_confluence"

[[secrets]]
name = "api_token"
prompt = "Atlassian API token. Go to id.atlassian.com/manage-profile/security/api-tokens, click Create API token, give it any name, then copy the string it shows you — Atlassian will not show it again."
format = "api_token"

[[secrets]]
name = "email"
prompt = "The email address you signed in to Atlassian with. It must be the same account that created the API token above, or Confluence will reject both."
sensitive = false
format = "email"

[[secrets]]
name = "base_url"
prompt = "Your Confluence web address, exactly as it appears in the browser bar when you are looking at a page. It ends in .atlassian.net — for example https://yourcompany.atlassian.net"
sensitive = false
format = "https_url"

[tools]
allow = [
  "confluence_search_pages",
  "confluence_get_page",
  "confluence_list_spaces",
  "confluence_create_page",
  "confluence_update_page",
]

[[tools.declared]]
name = "confluence_search_pages"
description = "Search pages with CQL."
classification = "read_only"

[[tools.declared]]
name = "confluence_get_page"
description = "Read one page's body by id."
classification = "read_only"

[[tools.declared]]
name = "confluence_list_spaces"
description = "List the spaces this account can see."
classification = "read_only"

# Publishing to a space is publishing to that space's audience — a destination
# the model names. Tagged so the egress gate sees it (D-580).
[[tools.declared]]
name = "confluence_create_page"
description = "Create a page in a space."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "confluence_update_page"
description = "Replace an existing page's title and body."
classification = "state_modifying"
capability_tags = ["network_egress"]

[approval]
default = "outbound"

# Dropbox through this bundle's own REST adapter, on an OAuth2 refresh token.
#
# D-588 ranks a connector's options: the vendor's own CLI first, a maintained MCP
# server second, an adapter we write only as a last resort — and a bundle taking
# the last option has to say what it checked. This one did.
#
# OPTION 1, the vendor's CLI (`dbxcli`): this bundle ran on it and it does not
# hold. Two faults, both structural. Its verbs name the object POSITIONALLY
# (`ls <path>`, `get <source>`, `put <dest>`), and a CliArgument renders only
# `--flag=value`, so `dbxcli` could declare no path, no download, and no upload —
# the connection was list-from-root-only, read-only. Worse, its ONLY unattended
# credential is `DBXCLI_ACCESS_TOKEN`, and every token Dropbox issues today is
# short-lived (the `sl.` prefix, ~4 hours): a pasted token worked when connected
# and was dead by the nightly run, every night. `dbxcli login` mints a refresh
# token, but only at a terminal, and its env token shadows it.
#
# OPTION 2, an MCP server: there is no maintained Dropbox MCP server to pin —
# `@dropbox/dropbox-mcp-server`, `dropbox-mcp`, `@modelcontextprotocol/server-
# dropbox` do not exist — and `mcp` is not a kind `build_attachment` constructs.
#
# So option 3: ~300 lines of httpx in arc_ext_dropbox/. It speaks OAuth2 the way
# the vendor recommends for an unattended app — a durable refresh token, from
# which Arc mints a short-lived access token on demand and caches it until it
# expires. Connect once, and it keeps working: the refresh token does not expire,
# and nothing on this host holds a token that does. The files API names paths in
# the request body, so this adapter has the full read AND write surface `dbxcli`
# could not: list, search, download, upload, create-folder, move, delete.
#
# The implementation is in arc_ext_dropbox/, a subdirectory, because bundle-root
# .py files are scanned as agent capabilities and are import-policy-gated by tier.

[extension]
name = "dropbox"
display_name = "Dropbox"
version = "2.0.0"
description = "Browse, read, and write the files in a Dropbox account."
attachment = "native"
tier_floor = "personal"

[config.native]
entrypoint = "arc_ext_dropbox"

[[secrets]]
name = "app_key"
prompt = "Your Dropbox app's App key. Go to dropbox.com/developers/apps, open your app (or Create app — Scoped access, Full Dropbox), and copy the App key shown on its Settings tab. It names the app and is safe to store in the clear."
sensitive = false

[[secrets]]
name = "app_secret"
prompt = "Your Dropbox app's App secret. On the same Settings tab at dropbox.com/developers/apps, click Show beside App secret and copy the value. Keep it private — Arc holds it in the secret store and never shows it again."
format = "api_token"

[[secrets]]
name = "refresh_token"
prompt = "A Dropbox refresh token, so Arc stays connected without you signing in again. On your app's Permissions tab tick files.metadata.read, files.content.read and files.content.write and Submit, then authorize the app once with token_access_type=offline and paste the refresh token the exchange returns here."
format = "api_token"

[tools]
allow = [
  "dropbox_list",
  "dropbox_search",
  "dropbox_download",
  "dropbox_account",
  "dropbox_upload",
  "dropbox_create_folder",
  "dropbox_move",
  "dropbox_delete",
]

[[tools.declared]]
name = "dropbox_list"
description = "List files and folders under a Dropbox path."
classification = "read_only"

[[tools.declared]]
name = "dropbox_search"
description = "Search the account for files and folders matching a query."
classification = "read_only"

[[tools.declared]]
name = "dropbox_download"
description = "Read a file's text content by path."
classification = "read_only"

[[tools.declared]]
name = "dropbox_account"
description = "Read the connected account's identity and storage use."
classification = "read_only"

# The four writes each send content or a change out to the account, a destination
# the model names, so each is tagged for the egress gate (D-580): allowed at
# personal tier, refused at federal until an operator hardens the path.
[[tools.declared]]
name = "dropbox_upload"
description = "Write a text file to a Dropbox path."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "dropbox_create_folder"
description = "Create a folder at a Dropbox path."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "dropbox_move"
description = "Move or rename a file or folder."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "dropbox_delete"
description = "Delete a file or folder."
classification = "state_modifying"
capability_tags = ["network_egress"]

[approval]
default = "outbound"

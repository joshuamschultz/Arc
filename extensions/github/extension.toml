# GitHub through the `gh` binary — D-571.
#
# READ-ONLY BY CONSTRUCTION, and not as a policy choice: `gh`'s write verbs
# (`pr create`, `issue create`, `pr merge`) print a URL rather than JSON, and a
# CliAttachment reports any non-JSON stdout as a tool ERROR. Declaring them would
# ship verbs that report failure on success, so they are absent. See the report.
#
# That absence is also the cleanest demonstration of D-570's point: an operator
# gets `github_pr_list` without ever getting `pr merge`, because authority comes
# from this manifest and not from a shell.
#
# No `[[secrets]]`: `gh auth login` keeps the token in the host keyring and Arc
# never handles it.

[extension]
name = "github"
version = "1.0.0"
description = "Read pull requests, issues, repositories, releases, and CI runs on GitHub."
attachment = "cli"
tier_floor = "personal"

# Every platform this release publishes a checksum for, each digest taken from
# gh_2.97.0_checksums.txt. Per-platform because a sha256 describes the bytes of
# ONE asset: a single digest was correct on linux/arm64 and described unrelated
# bytes everywhere else, which left `arc connector host-setup` the choice of
# skipping verification or refusing every host but the fleet's.
[artifact]
package = "cli/cli"
version = "2.97.0"

[artifact.platforms."linux/arm64"]
url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_arm64.tar.gz"
sha256 = "73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5"
member = "gh_2.97.0_linux_arm64/bin/gh"

[artifact.platforms."linux/amd64"]
url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz"
sha256 = "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
member = "gh_2.97.0_linux_amd64/bin/gh"

[artifact.platforms."darwin/arm64"]
url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_macOS_arm64.zip"
sha256 = "a58b8fd77b417a38f47a0b54d1370c59b0fcdb324ccc9ca002b0998f7c4c999e"
member = "gh_2.97.0_macOS_arm64/bin/gh"

[artifact.platforms."darwin/amd64"]
url = "https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_macOS_amd64.zip"
sha256 = "63298c998cc2a924c9e254c6af6a1caad6ece281122687a91f079bc0a462700e"
member = "gh_2.97.0_macOS_amd64/bin/gh"

# `gh` is the rare CLI whose login has BOTH shapes. `gh auth login` opens a
# browser and waits for a person; `gh auth login --with-token` reads the token on
# stdin and exits, so Arc can finish it and `token_command` says so. Every other
# CLI connector shipped here leaves that field empty, which is the honest "only a
# person at this host can do this".
#
# `gh auth status` is the sign-in check. `probe_argv = ["--version"]` below tells
# you a binary exists; this tells you an account is connected. Measured on the
# deployment, a signed-in host answers exit 0 with
# "✓ Logged in to github.com account <name>"; logged out it exits non-zero and
# says "You are not logged into any GitHub hosts". Both are required to match, so
# neither a future exit-code change nor a wording change alone can turn a logged-
# out host green.
[[host_requires]]
name = "gh"
minimum_version = "2.97.0"
authorize_command = "gh auth login --scopes repo,read:org"
token_command = "gh auth login --with-token"
verify_command = "gh auth status"
verify_pattern = "Logged in"
instruction = """
Install the GitHub CLI on this host, then authorise it:

  1. curl -fsSLO https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_arm64.tar.gz
  2. echo '73ea440ecad9c9e284429997ee6f93577bc6f7bc6fba357ef62c53ad8fb641a5  gh_2.97.0_linux_arm64.tar.gz' | sha256sum -c -
  3. tar xzf gh_2.97.0_linux_arm64.tar.gz && install -m 0755 gh_2.97.0_linux_arm64/bin/gh ~/.local/bin/gh
  4. gh auth login --scopes repo,read:org      # or: gh auth login --with-token < token-file
  5. gh auth status                            # confirm the account and scopes

Step 1 and 2 are for linux/arm64. For another platform take that asset and its
line from gh_2.97.0_checksums.txt in the same release; [artifact] pins the four
Arc can install for you.

Grant the narrowest scopes the agent needs. These tools only read, so a
read-only fine-grained token is enough.
"""

[tools]
allow = [
  "github_pr_list",
  "github_issue_list",
  "github_repo_list",
  "github_release_list",
  "github_run_list",
]

[[tools.declared]]
name = "github_pr_list"
description = "List or search pull requests in a repository."
classification = "read_only"

[[tools.declared]]
name = "github_issue_list"
description = "List or search issues in a repository."
classification = "read_only"

[[tools.declared]]
name = "github_repo_list"
description = "List repositories the authenticated account can see."
classification = "read_only"

[[tools.declared]]
name = "github_release_list"
description = "List releases of a repository."
classification = "read_only"

[[tools.declared]]
name = "github_run_list"
description = "List GitHub Actions workflow runs for a repository."
classification = "read_only"

[approval]
default = "outbound"

[config.cli]
binary = "gh"
probe_argv = ["--version"]
install_instruction = "See [[host_requires]] in this bundle's extension.toml."

# The --json field list is manifest data, fixed in argv: the model chooses which
# repository to read, never which fields come back.

[[config.cli.commands]]
tool = "github_pr_list"
argv = [
  "pr",
  "list",
  "--json=number,title,state,isDraft,author,headRefName,baseRefName,updatedAt,url",
]
description = "List or search pull requests. Use search for anything more selective than state."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "repo"
flag = "--repo"
description = "Repository as OWNER/REPO."

[[config.cli.commands.arguments]]
name = "search"
flag = "--search"
description = "GitHub search query, e.g. 'review-requested:@me' or 'is:open label:bug'."

[[config.cli.commands.arguments]]
name = "state"
flag = "--state"
description = "One of open, closed, merged, all. Defaults to open."

[[config.cli.commands.arguments]]
name = "author"
flag = "--author"
description = "Filter by author login."

[[config.cli.commands.arguments]]
name = "limit"
flag = "--limit"
description = "Maximum number of pull requests to return."

[[config.cli.commands]]
tool = "github_issue_list"
argv = ["issue", "list", "--json=number,title,state,author,labels,assignees,updatedAt,url"]
description = "List or search issues in a repository."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "repo"
flag = "--repo"
description = "Repository as OWNER/REPO."

[[config.cli.commands.arguments]]
name = "search"
flag = "--search"
description = "GitHub search query."

[[config.cli.commands.arguments]]
name = "state"
flag = "--state"
description = "One of open, closed, all. Defaults to open."

[[config.cli.commands.arguments]]
name = "assignee"
flag = "--assignee"
description = "Filter by assignee login."

[[config.cli.commands.arguments]]
name = "limit"
flag = "--limit"
description = "Maximum number of issues to return."

[[config.cli.commands]]
tool = "github_repo_list"
argv = ["repo", "list", "--json=name,nameWithOwner,description,isPrivate,isArchived,updatedAt,url"]
description = "List repositories the authenticated account can see."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "visibility"
flag = "--visibility"
description = "One of public, private, internal."

[[config.cli.commands.arguments]]
name = "language"
flag = "--language"
description = "Filter by primary language."

[[config.cli.commands.arguments]]
name = "limit"
flag = "--limit"
description = "Maximum number of repositories to return."

[[config.cli.commands]]
tool = "github_release_list"
argv = ["release", "list", "--json=name,tagName,isLatest,isDraft,isPrerelease,publishedAt"]
description = "List a repository's releases, newest first."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "repo"
flag = "--repo"
description = "Repository as OWNER/REPO."

[[config.cli.commands.arguments]]
name = "limit"
flag = "--limit"
description = "Maximum number of releases to return."

[[config.cli.commands]]
tool = "github_run_list"
argv = [
  "run",
  "list",
  "--json=databaseId,displayTitle,workflowName,status,conclusion,headBranch,createdAt,url",
]
description = "List GitHub Actions workflow runs — use it to see whether CI is green."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "repo"
flag = "--repo"
description = "Repository as OWNER/REPO."

[[config.cli.commands.arguments]]
name = "workflow"
flag = "--workflow"
description = "Workflow file name or display name."

[[config.cli.commands.arguments]]
name = "branch"
flag = "--branch"
description = "Filter runs by branch."

[[config.cli.commands.arguments]]
name = "status"
flag = "--status"
description = "Filter by status, e.g. failure, success, in_progress."

[[config.cli.commands.arguments]]
name = "limit"
flag = "--limit"
description = "Maximum number of runs to return."

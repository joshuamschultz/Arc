classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_draft_delete"
description = "Permanently delete one draft (drafts do not go to Trash)."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_modify"
description = "Add or remove labels on one message: star (add STARRED), mark read (remove UNREAD), archive (remove INBOX), or any label by name."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_thread_modify"
description = "Add or remove labels on every message in a thread."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_mark_read"
description = "Mark one message as read."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_mark_unread"
description = "Mark one message as unread."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_archive"

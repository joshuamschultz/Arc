flag = "--reply-to-message-id"
description = "Reply to this Gmail message id (sets the thread and reply headers)."

[[config.cli.commands.arguments]]
name = "thread_id"
flag = "--thread-id"
description = "Place the message in this Gmail thread."

[[config.cli.commands]]

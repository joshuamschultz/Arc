description = "Move one message to Trash (recoverable for 30 days with google_gmail_untrash)."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_untrash"
description = "Take one message back out of Trash."
classification = "state_modifying"

[[tools.declared]]
name = "google_gmail_send"
description = "Send an email now. It is delivered to the named recipients immediately."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "google_gmail_draft_send"
description = "Send an existing draft now, to the recipients it names."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "google_gmail_reply"
description = "Reply to the sender of one message, in its thread. Sent immediately."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "google_gmail_reply_all"
description = "Reply to everyone on one message, in its thread. Sent immediately."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "google_gmail_forward"
description = "Forward one message, with its attachments, to new recipients. Sent immediately."
classification = "state_modifying"

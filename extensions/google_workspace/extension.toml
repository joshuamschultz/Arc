# Google Workspace (Gmail, Drive, Calendar) through the `gog` binary — D-571.
#
# Part 1 of D-570, the INSTALL DIRECTIVE, is `[[host_requires]].instruction`
# below: the operator runs it, Arc only shows it. Part 2 is this manifest, which
# names every command as its own tool and is what grants authority. Part 3 is
# `skills/google_workspace/SKILL.md`, which teaches when to use which.
#
# Signing in is finished FROM THE BROWSER. `gog auth add --remote` is a two-step
# headless OAuth flow: step 1 prints a Google consent link; the operator signs in
# in their own browser, lands on a http://127.0.0.1:<port>/oauth2/callback page
# that fails to load, and pastes that address; step 2 exchanges it. The PKCE
# verifier from step 1 stays in gog's state directory on this host, so the pasted
# code is useless anywhere else. `[host_requires.remote_login]` below declares both
# steps and Arc drives them from the connection card — no terminal, no
# port-forward. The refresh token still lands only in this host's gog keyring and
# Arc never sees it.
#
# gog reads no environment variable for a credential, so there is still no
# `[secrets.placement]` for one. A service-account key is gog's other headless
# path, but gog documents it as "Workspace only; domain-wide delegation": a plain
# @gmail.com address has no domain to delegate in, so it does not help a personal
# account.
#
# WHY TOKENS DIED EVERY WEEK. Google expires the refresh tokens of an OAuth app
# whose consent screen is in "Testing" after about 7 days (invalid_grant). The fix
# is the operator's own Google Cloud OAuth client, published "In production", and
# the optional `client` field below naming it — see
# docs/runbooks/operate/google-accounts.md.
#
# Multi-account (D-550/D-571): each connection binds ONE account through the
# `account` field below, placed into GOG_ACCOUNT for every gog process that
# connection starts, and signs it in independently. Several verbs also accept an
# `--account` tool argument, which gog lets override GOG_ACCOUNT.

[extension]
name = "google_workspace"
display_name = "Google Workspace"
version = "1.0.0"
description = "Read and draft Gmail, list Drive files, and check Google Calendar."
attachment = "cli"
tier_floor = "personal"

[knowledge]
mode = "source"

# Pinned to one exact build and one digest PER PLATFORM (REQ-290), each taken
# from the release's own checksums.txt. Keyed by platform because a sha256
# describes the bytes of one asset: a single digest matched the fleet's
# linux/arm64 and silently described the wrong bytes on a laptop.
[artifact]
package = "openclaw/gogcli"
version = "0.34.1"

[artifact.platforms."linux/arm64"]
url = "https://github.com/openclaw/gogcli/releases/download/v0.34.1/gogcli_0.34.1_linux_arm64.tar.gz"
sha256 = "8510db6492c27f7704bf60af276f34ede81b67d88b6ffcf953153da841eaa3ed"
member = "gog"

[artifact.platforms."linux/amd64"]
url = "https://github.com/openclaw/gogcli/releases/download/v0.34.1/gogcli_0.34.1_linux_amd64.tar.gz"
sha256 = "a5b4be2ea635d4c830972dec1f3a90b0ca17f9c25e7a6353d1e068d8505ea983"
member = "gog"

[artifact.platforms."darwin/arm64"]
url = "https://github.com/openclaw/gogcli/releases/download/v0.34.1/gogcli_0.34.1_darwin_arm64.tar.gz"
sha256 = "90ab9104d543d16ac5367d405dc61b886003a118ce7eaddd0dd73c0363141449"
member = "gog"

[artifact.platforms."darwin/amd64"]
url = "https://github.com/openclaw/gogcli/releases/download/v0.34.1/gogcli_0.34.1_darwin_amd64.tar.gz"
sha256 = "14ae529f1ca9404252c5606689cd1e40a02b7357ca60f6491d9c85937342d3d4"
member = "gog"

# No `token_command`: there is no token to pipe in. The sign-in Arc runs is the
# two-step `remote_login` below.
#
# The sign-in CHECK is a real, read-only Gmail call made AS THIS CONNECTION'S
# ACCOUNT (GOG_ACCOUNT is placed from the `account` field), not `gog auth list`.
# `gog auth list` only proves a token is STORED: an account whose refresh token
# Google revoked lists exactly like a working one, which is how two dead accounts
# were reported "Signed in". Reading the INBOX label forces a token refresh, so it
# answers the question that matters — does this account work right now.
#
#   * working:        exit 0, `id<TAB>INBOX` on the first line (--plain output)
#   * never signed in: exit 1, "No auth for gmail <account>" / "Secret not found"
#   * revoked/expired: exit 1, `oauth2: "invalid_grant"` — measured on the
#                      deployment for both dead accounts. That is
#                      `verify_expired_pattern`, rendered as "Reconnect needed".
[[host_requires]]
name = "gog"
minimum_version = "0.34.1"
authorize_command = "gog auth add"
verify_command = "gog gmail labels get INBOX --plain --readonly --gmail-no-send --no-input"
verify_pattern = '(?m)^id\tINBOX\s*$'
verify_expired_pattern = 'invalid_grant|invalid_rapt|Token has been expired or revoked'
instruction = """
Install the gogcli binary on this host:

  1. curl -fsSLO https://github.com/openclaw/gogcli/releases/download/v0.34.1/gogcli_0.34.1_linux_arm64.tar.gz
  2. echo '8510db6492c27f7704bf60af276f34ede81b67d88b6ffcf953153da841eaa3ed  gogcli_0.34.1_linux_arm64.tar.gz' | sha256sum -c -
  3. tar xzf gogcli_0.34.1_linux_arm64.tar.gz && install -m 0755 gog ~/.local/bin/gog

Then sign each Google account in from its connection card in Arc: Open Google
sign-in, allow access, and paste the address the browser lands on. No terminal is
needed. So tokens do not expire every week, register your own OAuth client first
(docs/runbooks/operate/google-accounts.md) and set its name as the connection's
client.

Step 2 is not optional: it is the pin in [artifact] being checked. Steps 1 and 2
are for linux/arm64; for another platform take that asset and its line from the
same release's checksums.txt. [artifact] pins all four Arc can install for you.
"""

# The two-step sign-in, both steps run by Arc with this connection's placed
# environment (GOG_ACCOUNT, GOG_CLIENT), so the token lands in the same account and
# OAuth-client bucket the connection reads. The steps must ask for the SAME
# services and flags: gog only resumes a step-1 state whose client, scopes and
# consent flag match.
#
# Scopes are explicit and minimal. Left to itself `gog auth add` asks for
# `--services user` — ads, analytics, chat, classroom, photos and a dozen more —
# which an unverified app should never request. Here: Gmail, Calendar and Drive,
# Drive always read-only, and `--readonly={read_only}` (default yes) makes Gmail
# and Calendar read-only too. Drafting and sending mail is the opt-in `no`.
#
# `--client={client}` names the operator's own OAuth client. Blank leaves
# `--client=`, gog's built-in client — the labelled legacy fallback whose
# sign-ins Google expires after about 7 days (see `client` below).
[host_requires.remote_login]
begin = "gog auth add {account} --client={client} --readonly={read_only} --remote --step 1 --force-consent --services gmail,calendar,drive --drive-scope readonly --no-input"
complete = "gog auth add {account} --client={client} --readonly={read_only} --remote --step 2 --force-consent --services gmail,calendar,drive --drive-scope readonly --no-input --auth-url {redirect_url}"
consent_host = "accounts.google.com"

[tools]
allow = [
  "google_gmail_labels",
  "google_gmail_messages",
  "google_gmail_message",
  "google_gmail_history",
  "google_gmail_draft",
  "google_gmail_send",
  "google_drive_list",
  "google_calendar_list",
  "google_calendar_events",
  "google_calendar_freebusy",
]

[[tools.declared]]
name = "google_gmail_labels"
description = "List the Gmail labels on an account."
classification = "read_only"

[[tools.declared]]
name = "google_gmail_messages"
description = "List Gmail messages for connected-data indexing."
classification = "read_only"

[[tools.declared]]
name = "google_gmail_message"
description = "Read one Gmail message for connected-data indexing."
classification = "read_only"

[[tools.declared]]
name = "google_gmail_history"
description = "Read incremental Gmail mailbox changes for connected-data indexing."
classification = "read_only"

[[tools.declared]]
name = "google_gmail_draft"
description = "Create a Gmail draft. The draft is not sent."
classification = "state_modifying"

# The one verb here that puts agent-chosen content in front of a recipient the
# model names. Tagged so the egress gate (D-580) sees it: personal allows it,
# enterprise needs it in tools.policy.egress_allow, federal refuses this bundle
# at install because of this line. Under-tagging it would be the whole point of
# the gate, defeated.
[[tools.declared]]
name = "google_gmail_send"
description = "Send an email from an authorised Gmail account."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "google_drive_list"
description = "List or filter Google Drive files."
classification = "read_only"

[[tools.declared]]
name = "google_calendar_list"
description = "List the calendars an account can see."
classification = "read_only"

[[tools.declared]]
name = "google_calendar_events"
description = "List or search calendar events in a time window."
classification = "read_only"

[[tools.declared]]
name = "google_calendar_freebusy"
description = "Read free/busy blocks for calendars in a time window."
classification = "read_only"

# WHICH account this connection is. `gog` stores every address `gog auth add`
# signed in and refuses a bare read with "missing --account (or set GOG_ACCOUNT)"
# once there is more than one. This binds one connection to one address: the value
# is placed into GOG_ACCOUNT in every gog process this connection starts (and
# nowhere else), so two Google connections stay separate without threading a
# per-call --account through the sync path. It is an address, not a credential —
# `sensitive = false` so an operator can see they typed it right.
#
# The credential itself still lives only in this host's gog keyring (see the
# install note); in a headless service gog reads that keyring's password from
# GOG_KEYRING_PASSWORD, which the operator sets in the service environment and the
# gog child inherits. That one is the same for every account on the box, so it is
# an environment fact, not a per-connection field.
# Optional on purpose. gog reads a bare command with no --account when it holds
# exactly one token, so a single-account host needs nothing here and keeps
# working. Set it only when `gog auth add` signed in more than one address: then
# each connection names the one it reads, and an unset field places no GOG_ACCOUNT
# rather than an empty one gog would misread.
[[secrets]]
name = "account"
prompt = "Which Google account this connection reads, exactly as `gog auth list` shows it — for example josh@yourcompany.com. Leave blank if only one Google account is signed in on this host; set it when several are, so this connection reads the right mailbox."
sensitive = false
required = false
format = "email"

[secrets.placement]
variable = "GOG_ACCOUNT"

# WHICH OAuth client this connection's token belongs to. gog keeps named client
# credentials (`gog auth credentials set client_secret.json --client <name>`) and
# a separate token bucket per client; it is passed as --client to both sign-in
# steps and placed into GOG_CLIENT for every verb. Set it to the name of your own
# Google Cloud OAuth client, published "In production", and tokens stop expiring
# every seven days. A name, not a secret: the client secret stays in gog's own
# config on this host.
#
# Optional only so connections made before it existed keep working; blank is the
# labelled legacy fallback, and a sign-in without it must be acknowledged.
[[secrets]]
name = "client"
prompt = "The name of your own Google OAuth client, exactly as you stored it on this host with `gog auth credentials set <file> --client <name>` — for example arc."
sensitive = false
required = false
format = "name"
blank_warning = "No OAuth client is set, so this sign-in uses gog's built-in client. Google expires those sign-ins after about 7 days. Set your own client (Edit details) to stop that."

[secrets.placement]
variable = "GOG_CLIENT"

# How much the sign-in asks Google for. `yes` (the default): read Gmail, Calendar
# and Drive, nothing else. `no`: also draft and send Gmail — google_gmail_draft
# and google_gmail_send need it. Used only by the sign-in steps, so a change takes
# effect at the next Reconnect.
[[secrets]]
name = "read_only"
prompt = "Read-only access? yes = the agent can read mail, calendar and Drive but cannot draft or send (recommended). no = also allow drafting and sending Gmail. Reconnect after changing it."
sensitive = false
required = false
choices = ["yes", "no"]
default = "yes"

[approval]
default = "outbound"

[config.cli]
binary = "gog"
probe_argv = ["--version"]
install_instruction = "See [[host_requires]] in this bundle's extension.toml."

[config.source]
entrypoint = "arc_ext_google_workspace.source"

[[config.cli.commands]]
tool = "google_gmail_messages"
# `messages list` is an alias of `messages search`, whose selector is a
# POSITIONAL Gmail query, not a flag. There is no `--label`, and the page token
# flag is `--page`. Measured against gog v0.34.1:
#
#   gog gmail messages list --label INBOX   exit 2, unknown flag --label
#   gog gmail messages list -- label:INBOX  exit 0
#
# Every Gmail sync died on its first call for as long as the flags were guessed.
argv = [
  "gmail",
  "messages",
  "search",
  "--json",
  "--readonly",
  "--wrap-untrusted",
  "--no-input",
  "--",
]
description = "List Gmail messages for connected-data indexing."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "query"
description = "A Gmail search query, e.g. label:INBOX."

[[config.cli.commands.arguments]]
name = "limit"
flag = "--max"

[[config.cli.commands.arguments]]
name = "page_token"
flag = "--page"

[[config.cli.commands]]
tool = "google_gmail_message"
# `gmail get <messageId>`, not `gmail messages get`: the read verb sits at the
# gmail level and takes the id as a POSITIONAL, while `gmail messages` is the
# group for message operations. Measured against gog v0.34.1:
#
#   gog gmail messages get --id <id>   exit 2, unexpected argument get
#   gog gmail get -- <id>              exit 0
argv = [
  "gmail",
  "get",
  "--json",
  "--readonly",
  "--wrap-untrusted",
  "--no-input",
  "--",
]
description = "Read one Gmail message for connected-data indexing."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "id"
description = "The Gmail message id."

[[config.cli.commands]]
tool = "google_gmail_history"
# `gmail history`, not `gmail history list` — the latter is rejected as an
# unexpected argument. Its start marker is `--since`, and it takes no label.
argv = ["gmail", "history", "--json", "--readonly", "--wrap-untrusted", "--no-input"]
description = "List incremental Gmail history for connected-data indexing."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "limit"
flag = "--max"

[[config.cli.commands.arguments]]
name = "page_token"
flag = "--page"

[[config.cli.commands.arguments]]
name = "start_history_id"
flag = "--since"

# Every read command carries --readonly and --gmail-no-send: the binary refuses a
# mutating API call from inside, so a read verb cannot become a write one even if
# argv construction were wrong. --wrap-untrusted marks fetched text as external
# untrusted content (LLM01). --no-input means a prompt is a failure, never a hang.

[[config.cli.commands]]
tool = "google_gmail_labels"
argv = ["gmail", "labels", "list", "--json", "--readonly", "--gmail-no-send", "--no-input"]
description = "List the Gmail labels on an account. Use it to learn the label names the search verbs accept."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to act as (the address shown by `gog auth list`)."

[[config.cli.commands]]
tool = "google_gmail_draft"
argv = ["gmail", "drafts", "create", "--json", "--no-input"]
description = "Create a Gmail draft. Nothing leaves the account until a human sends it."
classification = "state_modifying"

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to act as."

[[config.cli.commands.arguments]]
name = "to"
flag = "--to"
description = "Recipients, comma-separated."

[[config.cli.commands.arguments]]
name = "subject"
flag = "--subject"
description = "Subject line."

[[config.cli.commands.arguments]]
name = "body"
flag = "--body"
description = "Plain-text body."

[[config.cli.commands]]
tool = "google_gmail_send"
argv = ["gmail", "send", "--json", "--no-input"]
description = "Send an email. This delivers to the named recipients immediately."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to send as."

[[config.cli.commands.arguments]]
name = "to"
flag = "--to"
description = "Recipients, comma-separated."

[[config.cli.commands.arguments]]
name = "cc"
flag = "--cc"
description = "CC recipients, comma-separated."

[[config.cli.commands.arguments]]
name = "bcc"
flag = "--bcc"
description = "BCC recipients, comma-separated."

[[config.cli.commands.arguments]]
name = "subject"
flag = "--subject"
description = "Subject line."

[[config.cli.commands.arguments]]
name = "body"
flag = "--body"
description = "Plain-text body."

[[config.cli.commands]]
tool = "google_drive_list"
argv = ["drive", "ls", "--json", "--readonly", "--wrap-untrusted", "--no-input"]
description = "List Drive files, optionally filtered by a Drive query or scoped to a folder."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to act as."

[[config.cli.commands.arguments]]
name = "query"
flag = "--query"
description = "Drive query filter, e.g. name contains 'budget'."

[[config.cli.commands.arguments]]
name = "parent"
flag = "--parent"
description = "Folder ID to list. Omit for the drive root."

[[config.cli.commands.arguments]]
name = "max"
flag = "--max"
description = "Maximum number of files to return."

[[config.cli.commands]]
tool = "google_calendar_list"
argv = ["calendar", "calendars", "--json", "--readonly", "--wrap-untrusted", "--no-input"]
description = "List the calendars this account can see, with their IDs."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to act as."

[[config.cli.commands]]
tool = "google_calendar_events"
argv = ["calendar", "events", "--json", "--readonly", "--wrap-untrusted", "--no-input"]
description = "List or free-text search calendar events inside a time window."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to act as."

[[config.cli.commands.arguments]]
name = "calendars"
flag = "--calendars"
description = "Comma-separated calendar IDs. Omit for the primary calendar."

[[config.cli.commands.arguments]]
name = "query"
flag = "--query"
description = "Free-text search over event titles and descriptions."

[[config.cli.commands.arguments]]
name = "from"
flag = "--from"
description = "Window start: RFC3339, a date, or a relative word like today or monday."

[[config.cli.commands.arguments]]
name = "to"
flag = "--to"
description = "Window end, same forms as from."

[[config.cli.commands.arguments]]
name = "max"
flag = "--max"
description = "Maximum number of events to return."

[[config.cli.commands]]
tool = "google_calendar_freebusy"
argv = ["calendar", "freebusy", "--json", "--readonly", "--wrap-untrusted", "--no-input"]
description = "Read free/busy blocks — availability only, no event contents."
classification = "read_only"

[[config.cli.commands.arguments]]
name = "account"
flag = "--account"
description = "Which authorised Google account to act as."

[[config.cli.commands.arguments]]
name = "cal"
flag = "--cal"
description = "Calendar ID or name to query."

[[config.cli.commands.arguments]]
name = "from"
flag = "--from"
description = "Window start."

[[config.cli.commands.arguments]]
name = "to"
flag = "--to"
description = "Window end."

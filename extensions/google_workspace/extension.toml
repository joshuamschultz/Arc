# gog has no untrash verb; removing the TRASH label through `messages modify` is
# the Gmail API's way back out of Trash.
[[config.cli.commands]]
tool = "google_gmail_untrash"
argv = ["gmail", "messages", "modify", "--json", "--gmail-no-send", "--no-input", "--remove=TRASH", "--"]
description = "Take one message back out of Trash."
classification = "state_modifying"

[[config.cli.commands.arguments]]
name = "message_id"
description = "The Gmail message id."

# Every verb that puts agent-chosen content in front of a recipient carries
# network_egress, so the egress gate (D-580) sees it: personal allows it,
# enterprise needs it in tools.policy.egress_allow, federal refuses this bundle.
# No verb takes --attach: a local file path would let a send read any file on the
# host.
[[config.cli.commands]]
tool = "google_gmail_send"
argv = ["gmail", "send", "--json", "--no-input"]
description = "Send an email now. It is delivered to the named recipients immediately."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[config.cli.commands.arguments]]
name = "to"
flag = "--to"
description = "Recipients, comma-separated."

[[config.cli.commands.arguments]]
name = "cc"
flag = "--cc"
description = "CC recipients, comma-separated."

[[config.cli.commands.arguments]]
name = "bcc"
flag = "--bcc"
description = "BCC recipients, comma-separated."

[[config.cli.commands.arguments]]

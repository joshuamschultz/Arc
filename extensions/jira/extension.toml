# Jira Cloud over Atlassian's REST API v3 (alpha-2 P18-3, 3.T).
#
# No binary. The operator sets the deployment's Atlassian sign-in app up ONCE
# (developer.atlassian.com, an OAuth 2.0 3LO app); every Jira and Confluence
# connection is then one click. Connect opens Atlassian's consent page, Atlassian
# sends the browser back to ArcUI's /oauth/callback page, and Arc swaps the code
# (state bound to the operator's session; Atlassian 3LO takes no PKCE) for a
# refresh token. The site this token reaches is resolved from accessible-resources
# BEFORE anything is stored; its cloud id is stored on the connection, so a
# consent given for another organisation binds nothing.
#
# Atlassian ROTATES refresh tokens: every use issues a new one and the old one is
# dead after a 10 minute reuse window. Arc persists the new token in the same
# custody write that releases the renewal lease, before any caller sees the new
# access token (credentials.py), so two processes never spend one refresh token.
#
# Tool names and argument names are the ones this bundle always declared; only what
# answers them changed, from the `acli` CLI to REST calls at
# api.atlassian.com/ex/jira/{cloud_id}/rest/api/3.
#
# The implementation is in arc_ext_jira/native.py; the knowledge source adapter is
# arc_ext_jira/__init__.py.

[extension]
name = "jira"
display_name = "Jira"
version = "3.0.0"
description = "Search, read, create, comment on, and transition Jira issues."
attachment = "native"
tier_floor = "personal"

[knowledge]
mode = "source"

[config.native]
entrypoint = "arc_ext_jira.native"

[config.source]
entrypoint = "arc_ext_jira"

# One Atlassian app slot serves both the jira and confluence bundles. The scopes
# are the classic Jira scopes Atlassian documents for every endpoint these six
# tools call; offline_access is what makes Atlassian return a refresh token.
[oauth]
provider = "atlassian"
authorize_url = "https://auth.atlassian.com/authorize"
token_url = "https://auth.atlassian.com/oauth/token"
resources_url = "https://api.atlassian.com/oauth/token/accessible-resources"
console_url = "https://developer.atlassian.com/console/myapps/"
refresh_token_secret = "refresh_token"
client_auth = "post_json"
pkce = false
account = "atlassian_site"
scopes = ["read:jira-work", "read:jira-user", "write:jira-work", "offline_access"]
authorize_params = { audience = "api.atlassian.com", prompt = "consent" }

# WHICH Atlassian site this connection is. Blank is accepted when the sign-in
# reaches exactly one site; Connect fills it in. Set: a consent for any other site
# is refused and nothing is stored. A host name, not a credential.
[[secrets]]
name = "site"
prompt = "Your Atlassian site, WITHOUT https://, for example yourcompany.atlassian.net. Leave blank and Arc fills it in when your account reaches only one site."
sensitive = false
required = false

# Written by Connect, never typed: the site's Atlassian id.
[[secrets]]
name = "cloud_id"
prompt = "Set for you when you click Connect: your Atlassian site id, read from the account you sign in with. You never type this."
sensitive = false
required = false

[[secrets]]
name = "refresh_token"
prompt = "Set for you when you click Connect. You never paste this."
required = false

# The cheapest real authenticated call: GET /myself.
[health]
probe = "attachment"

[tools]
allow = [
  "jira_search_issues",
  "jira_get_issue",
  "jira_list_projects",
  "jira_create_issue",
  "jira_add_comment",
  "jira_transition_issue",
]

[[tools.declared]]
name = "jira_search_issues"
description = "Search issues with JQL."
classification = "read_only"

[[tools.declared]]
name = "jira_get_issue"
description = "Read one issue by key."
classification = "read_only"

[[tools.declared]]
name = "jira_list_projects"
description = "List the projects this account can see."
classification = "read_only"

# The two verbs below put agent-authored text in front of a project's audience —
# a destination the model names. That is the external_comms leg, so they are
# tagged: enterprise needs each in tools.policy.egress_allow, and federal refuses
# this bundle at install because these lines exist.
[[tools.declared]]
name = "jira_create_issue"
description = "Create an issue in a project."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "jira_add_comment"
description = "Add a comment to an issue."
classification = "state_modifying"
capability_tags = ["network_egress"]

# A transition changes state; it carries no agent-authored content to an
# audience, so it is state_modifying without the egress leg.
[[tools.declared]]
name = "jira_transition_issue"
description = "Move an issue through its workflow."
classification = "state_modifying"

[approval]
default = "outbound"

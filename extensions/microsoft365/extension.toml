# Microsoft 365 (Outlook mail, calendar, OneDrive) over Microsoft Graph.
#
# No binary, no Node, no device code. Arc holds the credential (alpha-2 P18-3.M):
# the operator sets the deployment's Microsoft sign-in app up ONCE ("Set up
# Microsoft sign-in": the Entra app's client ID, its directory (tenant) ID, a client
# secret, and the cloud), then each mailbox is one click. Connect opens the tenant's
# own Entra sign-in page, Entra sends the browser back to ArcUI's /oauth/callback,
# and Arc swaps the code (PKCE S256, state bound to the operator's session) for a
# refresh token. The id_token is checked BEFORE anything is stored: issued to this
# app, by this tenant's authority, with tid == this tenant, as this connection's
# account. The refresh token is sealed in custody; tools get a short-lived access
# token from their credential handle at call time.
#
# Clouds. The app slot stores only a cloud KEY; the hosts below are the only ones a
# token or a request ever goes to. "global" is commercial AND GCC (moderate); GCC
# High and DoD are the "usgov" and "dod" keys. A tenant ID is required: "common" is
# refused, because a GCC tenant must sign in against its own directory.
#
# Ten Graph verbs, an explicit allowlist. Implementation: arc_ext_microsoft365/native/
# (a subdirectory, because bundle-root .py files are scanned as agent capabilities).

[extension]
name = "microsoft365"
display_name = "Microsoft 365"
version = "2.0.0"
description = "Read and send Outlook mail, manage the calendar, and browse OneDrive files."
attachment = "native"
tier_floor = "personal"

[knowledge]
mode = "source"

[config.native]
entrypoint = "arc_ext_microsoft365.native"

[config.source]
entrypoint = "arc_ext_microsoft365.source"

# Delegated scopes, least privilege (design: native-oauth.md section 13.2):
#   openid, profile    the id_token Arc checks (tenant + account); no data
#   offline_access     the refresh token
#   User.Read          GET /me: health probe and account check
#   Mail.Read          read mail and folders, mail delta for knowledge
#   Mail.Send          send-mail only (egress-tagged, approval-gated)
#   Calendars.ReadWrite  create-calendar-event (egress-tagged) and reads
#   Files.Read         the user's own OneDrive, read only
[oauth]
provider = "microsoft"
authorize_url = "https://{login_host}/{tenant}/oauth2/v2.0/authorize"
token_url = "https://{login_host}/{tenant}/oauth2/v2.0/token"
console_url = "https://entra.microsoft.com/"
refresh_token_secret = "refresh_token"
client_auth = "post_form"
pkce = true
account = "openid_username"
id_token_issuers = ["https://{login_host}/{tenant}/v2.0"]
app_tenant = true
default_cloud = "global"
refresh_scopes = true
scopes = [
  "openid",
  "profile",
  "offline_access",
  "User.Read",
  "Mail.Read",
  "Mail.Send",
  "Calendars.ReadWrite",
  "Files.Read",
]
authorize_params = { response_mode = "query", prompt = "select_account" }

[oauth.clouds.global]
label = "Commercial / GCC"
login_host = "login.microsoftonline.com"
api_host = "graph.microsoft.com"

[oauth.clouds.usgov]
label = "GCC High"
login_host = "login.microsoftonline.us"
api_host = "graph.microsoft.us"

[oauth.clouds.dod]
label = "DoD"
login_host = "login.microsoftonline.us"
api_host = "dod-graph.microsoft.us"

# The cheapest real authenticated call: GET /me, which also checks the signed-in
# user is still this connection's account.
[health]
probe = "attachment"

[tools]
allow = [
  "list-mail-messages",
  "get-mail-message",
  "list-mail-folders",
  "send-mail",
  "list-calendar-events",
  "get-calendar-view",
  "create-calendar-event",
  "list-folder-files",
  "get-onedrive-file",
  "search-onedrive-files",
]

[[tools.declared]]
name = "list-mail-messages"
description = "List Outlook messages in the signed-in mailbox."
classification = "read_only"

[[tools.declared]]
name = "get-mail-message"
description = "Read one Outlook message, including its body."
classification = "read_only"

[[tools.declared]]
name = "list-mail-folders"
description = "List the mail folders in the mailbox."
classification = "read_only"

# The one sending verb in the set. Tagged so the egress gate (D-580) sees it,
# which also means this bundle is refused at federal tier at install.
[[tools.declared]]
name = "send-mail"
description = "Send an Outlook email to the named recipients."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "list-calendar-events"
description = "List calendar events."
classification = "read_only"

[[tools.declared]]
name = "get-calendar-view"
description = "Read the calendar over an explicit time window, recurrences expanded."
classification = "read_only"

# Creating an event mails an invitation to every attendee the model names, so it
# is an egress verb even though it reads like a write.
[[tools.declared]]
name = "create-calendar-event"
description = "Create a calendar event. Attendees are invited by email."
classification = "state_modifying"
capability_tags = ["network_egress"]

[[tools.declared]]
name = "list-folder-files"
description = "List files in a OneDrive folder."
classification = "read_only"

[[tools.declared]]
name = "get-onedrive-file"
description = "Read one OneDrive file by identifier."
classification = "read_only"

[[tools.declared]]
name = "search-onedrive-files"
description = "Search OneDrive files by name and content."
classification = "read_only"

# WHICH mailbox this connection is. Blank: filled in at the first connect from the
# verified sign-in. Set: a sign-in as anyone else is refused and nothing is stored.
[[secrets]]
name = "account"
prompt = "Which Microsoft 365 account this connection is for, for example josh@agency.gov. Leave blank and Arc fills it in from the account you sign in with."
sensitive = false
required = false
format = "email"

# Written by Connect from the deployment's Microsoft sign-in app, never typed.
[[secrets]]
name = "tenant_id"
prompt = "Set for you when you click Connect, from the Microsoft sign-in app: the directory (tenant) ID this sign-in belongs to. You never type it here."
sensitive = false
required = false

[[secrets]]
name = "cloud"
prompt = "Set for you when you click Connect, from the Microsoft sign-in app: which Microsoft cloud (Commercial / GCC, GCC High or DoD) this sign-in uses."
sensitive = false
required = false

[[secrets]]
name = "refresh_token"
prompt = "Set for you when you click Connect. You never paste this."
required = false

[approval]
default = "outbound"

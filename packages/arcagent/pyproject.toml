[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc-agent"
version = "0.18.0"
description = "Enterprise-grade autonomous agent nucleus"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.14.2,<3",
    "pynacl>=1.5,<2",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "httpx>=0.27,<1",
    "mcp>=1.25,<2",
    "arcprompt>=0.1",
    "arcrun>=0.9,<1",
    "arctrust>=0.9,<1",
    "pyyaml>=6.0,<7",
    "tomlkit>=0.12",
    "packaging>=24.0,<27",
    "websockets>=13.0,<16",
    "croniter>=2.0,<7",
    "aiorwlock>=1.4,<2",
]

[project.optional-dependencies]
# Dual-speed analogical memory. arcagent runs memory-less by default (NullBrain);
# installing this extra + setting [modules.memory] brain = "arcmemory" activates it.
memory = [
    "arcmemory",
]
azure = [
    "azure-identity>=1.15",
    "azure-keyvault-secrets>=4.7",
]
# NOTE: the agentic browser_task tool needs `browser-use` (>=0.13), but it
# hard-pins aiohttp==3.13.4, which is incompatible with the aiohttp>=3.14.3
# CVE floor that arcgateway's mattermost extra requires. So it is
# deliberately NOT a workspace extra — install it into the deployment venv
# separately (`pip install browser-use && browser-use install`) on boxes that
# use it. Federal deployments must not install it — browser_task is forbidden
# at the federal tier.

[project.urls]
Homepage = "https://github.com/joshuamschultz/Arc"
Repository = "https://github.com/joshuamschultz/Arc"
Issues = "https://github.com/joshuamschultz/Arc/issues"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "E402", "E501", "N806", "E741", "B007", "B017", "S603", "RUF043", "RUF059", "F811", "F821", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
# Skill scaffolding scripts are standalone, sandbox-executed files (never
# imported as package modules) and several share the basename ``validate.py``,
# which collides under module resolution. They are not part of the package's
# type surface.
exclude = ['builtins/capabilities/skills/.*/scripts/.*\.py$']

[[tool.mypy.overrides]]
module = ["arccli.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Azure SDK ships partial type stubs; ignore missing imports for optional dep.
module = ["azure.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional dep for browser_task: browser-use is installed into the deployment
# venv separately (not a workspace extra — aiohttp pin conflict).
module = ["browser_use.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# The workspace root, so a test importing a sibling helper by its full path
# (`packages.arcagent.tests.conftest`) resolves the same whether pytest was
# pointed at this package or at the whole repo. Those full paths are not
# decoration: a bare `tests.conftest` makes all eight test-bearing packages
# claim one module name, and the whole-repo run dies in collection.
pythonpath = ["../.."]
markers = [
    "slow: live-runtime tests (real docker) excluded from the fast unit run",
    "requires_docker: needs a reachable Docker daemon; skipped locally, required in CI",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arcagent"]
# Ship the packaged context templates regardless of VCS state — they are loaded at
# runtime, not optional data.
artifacts = ["src/arcagent/context/**/*.md"]
# SPEC-066 REQ-336: no module code in the wheel. A module reaches a deployment as a
# signed bundle materialized to ${ARC_CONFIG_DIR:-~/.arc}/modules/, so a box that was
# never approved for the browser module does not carry its source. The tree stays in
# the repository — it is the catalog `arc module bundle` and `--from-source` package
# from — only the built artifact loses it. One exclusion, no tier condition: the wheel
# is byte-identical everywhere (D-066-3).
exclude = ["src/arcagent/modules/*/"]

[tool.coverage.run]
source = ["arcagent"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "types-PyYAML>=6.0",
    "types-croniter>=6.0",
    "freezegun>=1.0",
]

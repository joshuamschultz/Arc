# A minimal native connector that declares an [oauth] authorization-code flow, so
# `begin_oauth` / `complete_oauth` can be exercised end to end against a real store
# without a socket. Mirrors the reference extension: the "service" is the object
# itself, so the only thing under test is the framework's OAuth wiring, never an
# upstream.
[extension]
name = "oauth_reference"
version = "1.0.0"
description = "A reference OAuth connector for the native code-exchange flow."
attachment = "native"

[config.native]
entrypoint = "oauth_attachment"

# The only credential is the refresh token the connect flow writes; the app's client
# id and secret live in the deployment's app slot for `provider`, not here.
[[secrets]]
name = "refresh_token"
prompt = "Set when you click Connect. You never paste this."
required = false

[oauth]
provider = "oauth_reference"
authorize_url = "https://provider.example/oauth2/authorize"
token_url = "https://provider.example/oauth2/token"
refresh_token_secret = "refresh_token"
scopes = ["read"]
client_auth = "post_form"
authorize_params = { token_access_type = "offline" }

[tools]
allow = ["oauth_ping"]

[[tools.declared]]
name = "oauth_ping"
description = "Report whether the refresh token arrived."
classification = "read_only"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcbundle"
version = "0.9.0"
description = "Signed module bundles for Arc — manifest, verification, and atomic materialize (leaf)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
# Leaf beside arctrust: arcbundle owns the on-disk distribution unit and knows
# nothing of the agent that will later read a materialized module. arctrust
# supplies the Ed25519 + canonical-JSON primitives; nothing else is permitted,
# so a bundle can be built and verified on a low-side box with no agent stack.
dependencies = [
    "arctrust",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/joshuamschultz/Arc"
Repository = "https://github.com/joshuamschultz/Arc"
Issues = "https://github.com/joshuamschultz/Arc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arcbundle"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "E402", "E501", "N806", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# The workspace root, so a test importing a sibling helper by its full path
# resolves the same whether pytest was pointed at this package or the whole
# repo — uniform with every other package (see arctrust/pyproject.toml).
pythonpath = ["../.."]

[tool.coverage.run]
source = ["arcbundle"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

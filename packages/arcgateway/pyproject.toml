[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcgateway"
version = "0.4.0"
description = "Gateway daemon — runs ArcAgents behind any chat platform"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
    "arc-agent>=0.2",
    "watchfiles>=0.21",
    # Direct, not transitive: audit.py, media_store.py, pairing.py, identity.py,
    # config.py, workflow_runner_host.py, executor_subprocess.py, the registry and
    # both token-bearing adapters all `import arctrust`, and session.py takes
    # `build_session_key` from `arctrust.session_identity` (the derivation lives on
    # a leaf because arcagent may not import arcgateway). The uv workspace resolves
    # this regardless of what is declared here, which is exactly why the edge has to
    # be written down: a standalone `pip install arcgateway` fails at import without
    # it, and this repo has already been bitten once by a missing edge that showed up
    # only in Docker and got papered over with a sync-everything runbook rule.
    "arctrust>=0.9",
    # SPEC-061 (ArcFlow): COMP-009 RunnerHost owns the arcteam WorkflowRunner's
    # lifecycle on the agent side of the fleet service; it needs both the
    # engine (arcteam) and the shared run/task store (arcstore).
    "arcstore>=0.2",
    "arcteam>=0.6",
]

# Platform adapters are in-tree folders under ``src/arcgateway/adapters/``,
# discovered by scanning for a module-level ``PLATFORM`` descriptor (SPEC-065
# REQ-308). Adding a platform is adding a folder; deleting the folder deletes
# the platform. What is optional is not the adapter but the third-party client
# it needs, so each platform ships as an extra:
#   pip install 'arcgateway[telegram]'
#   pip install 'arcgateway[slack]'
#   pip install 'arcgateway[mattermost]'
# Without its extra, the platform is skipped at personal/enterprise tier with
# the reason recorded, and refuses startup at federal.
[project.optional-dependencies]
telegram = ["python-telegram-bot>=20,<22"]
slack = ["slack-bolt>=1.18", "slack-sdk>=3", "aiohttp>=3.14.3,<4"]
# 3.14.3 is the security floor: it clears the WebSocket-upgrade request
# smuggling and the undeclared-permessage-deflate RSV1 decompress
# (PYSEC-2026-3546/3547), both reachable by anything that serves or dials a
# WebSocket, plus the C-parser out-of-bounds read (PYSEC-2026-3545).
mattermost = ["aiohttp>=3.14.3,<4"]

[project.scripts]
arcgateway = "arcgateway.cli:main"

[project.urls]
Homepage = "https://github.com/joshuamschultz/Arc"
Repository = "https://github.com/joshuamschultz/Arc"
Issues = "https://github.com/joshuamschultz/Arc/issues"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# CLI is a user-facing text interface; print() is correct output mechanism here
"src/arcgateway/cli.py" = ["T201"]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "E402", "E501", "N802", "N806", "E741", "B007", "B017", "S603", "RUF043", "RUF059", "F811", "F821", "RUF003"]
# Exception names are SDD-018 §3.1 public API contract; cannot rename.
# PostgresPairingStore stub has intentionally unused 'dsn' param (deferred impl T1.8.4).
"src/arcgateway/pairing.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["arcagent.*", "arcllm.*", "arcrun.*", "arccli.*"]
ignore_missing_imports = true

# Platform clients for the in-tree adapters. Optional extras, and none of them
# ships complete stubs — suppress missing-import noise so --strict stays clean.
[[tool.mypy.overrides]]
module = ["telegram.*", "slack_bolt.*", "slack_sdk.*", "aiohttp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# The workspace root, so a test importing a sibling helper by its full path
# (`packages.arcgateway.tests.conftest`) resolves the same whether pytest was
# pointed at this package or at the whole repo. Those full paths are not
# decoration: a bare `tests.conftest` makes all eight test-bearing packages
# claim one module name, and the whole-repo run dies in collection.
pythonpath = ["../.."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"'); opt-in via '-m slow'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arcgateway"]

[tool.coverage.run]
source = ["arcgateway"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "mypy>=1.19.1",
]

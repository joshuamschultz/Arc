[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcokf"
version = "0.2.0"
description = "Strict Open Knowledge Format parsing and validation for Arc"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/arcokf"]

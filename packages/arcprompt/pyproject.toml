[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcprompt"
version = "0.1.0"
description = "Editable, signed, inspectable system prompts for Arc"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "arctrust>=0.1",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/joshuamschultz/Arc"
Repository = "https://github.com/joshuamschultz/Arc"
Issues = "https://github.com/joshuamschultz/Arc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arcprompt"]
# Prompt markdown is loaded at runtime, not optional data — guarantee it ships
# in the wheel regardless of VCS state (REQ-140; the SPEC-047 blueprint lesson).
artifacts = ["src/arcprompt/**/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Spec-mandated exception names (COMP-001/002): descriptive, not Error-suffixed —
# the same convention as arcgateway/pairing.py and arc's PolicyDenied/EgressDenied.
"src/arcprompt/errors.py" = ["N818"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# The workspace root, so a test importing a sibling helper by its full path
# (`packages.arcprompt.tests.conftest`) resolves the same whether pytest was
# pointed at this package or at the whole repo. Those full paths are not
# decoration: a bare `tests.conftest` makes all eight test-bearing packages
# claim one module name, and the whole-repo run dies in collection.
pythonpath = ["../.."]

[tool.coverage.run]
source = ["arcprompt"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcskill"
version = "0.3.0"
description = "Skill management hub for Arc — signed install, scan, lock, CRL lifecycle"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "arctrust>=0.1",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/joshuamschultz/Arc"
Repository = "https://github.com/joshuamschultz/Arc"

[tool.hatch.build.targets.wheel]
packages = ["src/arcskill"]
artifacts = ["src/arcskill/**/*.md"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# sigstore ships no type stubs and is an optional [hub] extra — absent from the
# base env. Guarded by _sigstore_importable(); ignore missing imports in the
# importing module so strict passes with or without the extra installed.
[[tool.mypy.overrides]]
module = ["arcskill.hub.verify"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# The workspace root, so a test importing a sibling helper by its full path
# (`packages.arcskill.tests.conftest`) resolves the same whether pytest was
# pointed at this package or at the whole repo. Uniform across every package:
# the moment one keeps prepend mode, a bare `tests` resolves again from its own
# rootdir and the whole-repo run dies in collection.
pythonpath = ["../.."]

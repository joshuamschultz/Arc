[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arctrust"
version = "0.10.0"
description = "Identity, keypair, audit, and policy primitives for Arc — leaf shared library"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pynacl>=1.5,<2",
    "pydantic>=2.0,<3",
    # Security floor, not a feature floor: 50.0.0 is the first release clear of
    # PYSEC-2026-3552/3553/3554 — the last of which is a name-constraint
    # wildcard escape that makes an invalid certificate chain verify, which the
    # mTLS and X.509 identity paths must never accept. Deliberately uncapped:
    # FIPS posture comes from the linked OpenSSL provider (see fips.py), never
    # from the Python package version, so an upper cap buys no FIPS
    # compatibility and only blocks the next security fix.
    "cryptography>=50.0.0",
    "tomlkit>=0.13,<1",
]

[project.urls]
Homepage = "https://github.com/joshuamschultz/Arc"
Repository = "https://github.com/joshuamschultz/Arc"
Issues = "https://github.com/joshuamschultz/Arc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arctrust"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "E402", "E501", "N806", "E741"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# The workspace root, so a test importing a sibling helper by its full path
# (`packages.arctrust.tests.conftest`) resolves the same whether pytest was
# pointed at this package or at the whole repo. Uniform across every package:
# the moment one keeps prepend mode, a bare `tests` resolves again from its own
# rootdir and the whole-repo run dies in collection.
pythonpath = ["../.."]

[tool.coverage.run]
source = ["arctrust"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

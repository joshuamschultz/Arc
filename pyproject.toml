[project]
name = "arc"
version = "0.2.0"
description = "Arc: Autonomous agent framework"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "arc-agent",
    "arccmd",
    "arcgateway",
    # arcui backs `arc ui start` — the dashboard, the web-chat WebSocket, and the
    # embedded gateway every deployment surface runs on (container ENTRYPOINT,
    # cloud compose, the systemd unit, and `arc tui`'s attach-or-serve path).
    # Nothing else depends on it, so without this edge a bare `uv sync` leaves it
    # out and every one of those paths dies at startup on "No module named
    # 'arcui'" — after the agents have already been built, which makes it read
    # like an agent problem instead of a missing package.
    "arcui",
    # arcmemory ships in the default workspace env so scaffolded agents
    # (brain = "arcmemory") have a working Brain out of the box. arc-agent
    # itself keeps it optional (no static import); this is the deployment env.
    # The [local] extra is pinned here for the same reason as arcskill below:
    # extras are NOT installed by `uv sync --all-packages`, so without this edge
    # the default embed_backend = "local" had no embedder and hybrid recall ran
    # with its semantic third silently missing. Heavy (pulls torch, ~2GB) — that
    # is the price of "semantic recall works out of the box".
    "arcmemory[local]",
    # arcskill is the default skills adapter (skills.adapter = "arcskill" ->
    # arcskill.improver). Nothing else depends on it, so without this edge it is
    # only present under `uv sync --all-packages` and `arc ext verify` sees the
    # builtin adapter as unavailable in a default-synced env. Pin it here for the
    # same reason as arcmemory: the default extension must load out of the box.
    "arcskill",
    # Telegram is the default remote gateway surface. Since SPEC-065 the
    # adapter itself is in-tree, but its client library is an extra — and
    # extras are NOT installed by `uv sync --all-packages`, so without this
    # edge a bare sync + an enabled [platforms.telegram] block starts a
    # gateway that skips Telegram (silently, at personal/enterprise tier).
    # Pin the extra here so it ships out of the box.
    "arcgateway[telegram]",
    "croniter>=6.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "types-pyyaml>=6.0.12.20260408",
    "types-croniter>=6.2.2.20260408",
    "freezegun>=1.5.5",
    "python-dotenv>=1.2.2",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "faker>=37.0",
    "freezegun>=1.5.0",
    "tomlkit>=0.12",
]
# Tutorial / help-docs tooling — Jupyter notebook walkthroughs only. NOT part of
# the harness runtime closure and deliberately excluded from the CI security
# audit (which scopes to the runtime requirements export). Their transitive CVEs
# (jupyterlab, jupyter-server, tornado, bleach) never ship in Arc.
tutorial = [
    "nbformat>=5.10.4",
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
]

[tool.uv]
# Security floors for transitive runtime dependencies. These packages are pulled
# in indirectly (mcp, azure-core, boto3, docker, httpx, rich) and have no direct
# constraint to raise, so we pin the minimum patched version here. Each floor
# closes CVEs surfaced by the CI pip-audit gate; see sbom/security-suppressions.txt
# for anything that could NOT be floored.
constraint-dependencies = [
    "click>=8.3.3",           # PYSEC-2026-2132 (via arccmd/uvicorn)
    "mcp>=1.28.1",           # PYSEC-2026-3481/3482/3483 (via arc-agent)
    "setuptools>=83.0.0",    # PYSEC-2026-3447 (runtime transitive via torch)
    "torch>=2.13.0",         # PYSEC-2025-194 (default arcmemory[local] runtime)
    "pyjwt>=2.13.0",          # PYSEC-2026-120/175/176/177/178/179 (via mcp[crypto], msal)
    "python-multipart>=0.0.31", # CVE-2026-40347/42561/53538/53539/53540 (via mcp)
    "requests>=2.33.0",       # CVE-2026-25645 (via azure-core, docker)
    "urllib3>=2.7.0",         # PYSEC-2026-141/142 (via botocore, requests)
    "idna>=3.15",             # PYSEC-2026-215 (via anyio/httpx)
    "pygments>=2.20.0",       # CVE-2026-4539 (via rich)
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
arcllm = { workspace = true }
arcrun = { workspace = true }
arcteam = { workspace = true }
arcmas = { workspace = true }
arctrust = { workspace = true }
arcstore = { workspace = true }
arcmemory = { workspace = true }
arcskill = { workspace = true }
arctui = { workspace = true }
arcui = { workspace = true }
arcprompt = { workspace = true }
arcmodel = { workspace = true }
arccmd = { workspace = true, editable = true }
arc-agent = { workspace = true, editable = true }
arcgateway = { workspace = true, editable = true }

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S105", "S106", "E402", "S603"]
"scripts/**/*.py" = ["T201"]
# SBOM report generator: emits a wide-table markdown doc with unicode symbols
# (arrows, ×) and a status print — line-length/ambiguous-unicode/print lints
# do not apply to generated report content.
"sbom/_gen_report.py" = ["E501", "RUF001", "T201"]
"walkthroughs/**/*.ipynb" = ["S101", "B007", "S307", "S110", "T20", "F401", "F811", "E501", "F821", "E741", "E402", "I001", "S603", "S108", "A002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
# Skill payload scripts ship inside skill bundles (not importable package
# modules); several share a filename (e.g. validate.py), which collides under
# mypy's module resolution. They are not part of the typed package surface.
exclude = ['\/skills\/[^/]+\/scripts\/', '\/src\/arctui\/tests\/']

# Optional third-party dependencies without type stubs. These are guarded by
# runtime import checks and only pulled in via extras (otel/aws/docker/schema).
[[tool.mypy.overrides]]
module = [
    "jsonschema",
    "jsonschema.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "docker",
    "docker.*",
    "dateparser",
    "dateparser.*",
    "azure.*",
    "opentelemetry.exporter.otlp.*",
    "sqlite_vec",
    "sqlite_vec.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "slack_bolt",
    "slack_bolt.*",
    "browser_use",
    "browser_use.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Sigstore is an optional arcskill hub dependency and does not publish complete
# typing metadata. The module performs an importability check before loading it.
module = ["arcskill.hub.verify"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The Slack integration's @app.event handlers are decorated by the stub-less
# optional slack_bolt lib (its decorators resolve to Any), so strict
# untyped-decorator checks don't apply to this optional-dependency module.
module = ["arcagent.modules.slack.bot"]
disallow_untyped_decorators = false
# slack_bolt has no stubs: connect_async is untyped when [slack] is installed
# (needs a per-call ignore), but resolves to Any when it is not (ignore unused).
# Don't warn on the ignore in the extra-absent env.
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Every package's test tree is addressed by its path from this directory —
# `packages.arcagent.tests.conftest`, never a bare `tests.conftest`. Two things
# are load-bearing and neither works alone:
#
#   --import-mode=importlib      derives that dotted name from the file's path
#                                RELATIVE TO ROOTDIR, but only for a directory
#                                that is not already an importable package. An
#                                `__init__.py` under a `tests/` dir short-
#                                circuits it to the package root, and every
#                                package then claims the single name `tests`.
#   consider_namespace_packages  makes those dotted paths importable, so a test
#                                can import a sibling helper by its real path.
#
# So: no `__init__.py` at the ROOT of a test tree. Subdirectories below it may
# still have one — those resolve through the repo-root anchor and stay unique —
# but an `__init__.py` next to the `tests/` dir itself makes that package claim
# the bare name `tests` alongside all seven others and the root `tests/` tree.
# The whole-repo run then dies in collection with "Plugin already registered
# under a different name" and silently drops the trees it could not name: it
# reported 6027 tests where the real count is 11503. Per-package runs stay green
# throughout and CI runs per package, so nothing caught it.
# tests/architecture/test_test_tree_module_names.py guards both halves.
addopts = "--strict-markers -v --import-mode=importlib"
consider_namespace_packages = true
# Rootdir on sys.path so those `packages.<pkg>.tests.*` paths actually import.
pythonpath = ["."]
markers = [
    "slow: end-to-end test that starts a real nats-server (skipped when the binary is absent)",
    "requires_docker: needs a reachable Docker daemon; skipped locally, required in CI",
]

[tool.coverage.run]
# The adapter registry's contract is "a platform is a folder", so the tests that
# prove it must create real folders inside the real package — a tmp_path copy
# would exercise a scan of somewhere the gateway never scans. Those folders are
# deleted in teardown, which used to leave coverage holding measurements of
# files that no longer exist; `coverage json` then failed hard and took the
# whole G1.7 gate down with it. Excluding the fixtures by name keeps the gate
# measuring only code that outlives the test that touched it.
omit = [
    "*/arcgateway/adapters/broken_*/*",
    "*/arcgateway/adapters/probe_*/*",
]
